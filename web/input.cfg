// Input defaults for VectorET.
//
// Written into fs_homepath/legacy at boot and exec'd, rather than shipped in
// a pak, so it stays editable next to the rest of the web shell.
//
// Why this exists: some webviews refuse Pointer Lock, and without it there is
// no mouse look at all. Stock ET binds only WASD - nothing turns the view
// without a mouse - so a player in such a webview cannot even look around.
// This file provides both ways out: a gamepad, and failing that, keyboard
// look on the arrow keys.
//
// Two separate paths feed the engine, and both have to be on:
//   - right stick  -> SDL_CONTROLLERAXISMOTION -> j_pitch / j_yaw (analog look)
//   - left stick   -> PAD0_LEFTSTICK_* key events, scaled by in_joystickUseAnalog
// in_joystickUseAnalog gates BOTH, so without it the sticks are on/off only.

seta in_joystick 1
seta in_joystickUseAnalog 1
seta in_joystickThreshold 0.15

// Look sensitivity. The engine defaults are tuned for a flight stick and are
// far too slow to aim with; negative j_yaw matches the engine's own sign
// convention (see cl_cvars.c) so right on the stick looks right.
seta j_pitch 0.10
seta j_yaw  -0.14
seta j_forward -0.25
seta j_side 0.25

// --- movement (left stick) ---
bind PAD0_LEFTSTICK_UP    "+forward"
bind PAD0_LEFTSTICK_DOWN  "+back"
bind PAD0_LEFTSTICK_LEFT  "+moveleft"
bind PAD0_LEFTSTICK_RIGHT "+moveright"

// --- core actions ---
bind PAD0_RIGHTTRIGGER    "+attack"
bind PAD0_LEFTTRIGGER     "+speed"          // sprint
bind PAD0_A               "+moveup"         // jump
bind PAD0_B               "+movedown"       // crouch
bind PAD0_X               "+useitem"        // use / revive / plant
bind PAD0_Y               "+reload"
bind PAD0_RIGHTSHOULDER   "weapnext"
bind PAD0_LEFTSHOULDER    "weapprev"
bind PAD0_RIGHTSTICK_CLICK "+zoom"
bind PAD0_LEFTSTICK_CLICK "+prone"

// --- menus and comms ---
bind PAD0_START           "togglemenu"
bind PAD0_BACK            "+scores"
bind PAD0_DPAD_UP         "+topshots"
bind PAD0_DPAD_DOWN       "mapexpand"
bind PAD0_DPAD_LEFT       "openlimbomenu"
bind PAD0_DPAD_RIGHT      "+stats"

// --- keyboard look, for when there is no mouse and no pad ---
// Stock ET leaves the arrow keys unbound and has no turn keys at all, so
// without these a player who cannot get pointer lock is stuck facing one way.
// WASD still moves; the arrows become the view, Quake-style keyboard look.
bind LEFTARROW  "+left"
bind RIGHTARROW "+right"
bind UPARROW    "+lookup"
bind DOWNARROW  "+lookdown"
bind END        "centerview"

// keyboard turn rates: the stock 140/140 is sluggish when it is your only aim
seta cl_yawspeed 190
seta cl_pitchspeed 140

echo "^2input defaults loaded ^7- pad, or arrow keys to look if there is no mouse"
